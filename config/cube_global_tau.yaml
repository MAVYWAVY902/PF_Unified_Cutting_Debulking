## Baseline: uniform global τ (midpoint of 0.1 and 0.8 ≈ 0.45)

name: "Cube Global τ (Uniform Baseline)"
debulking: true   # explicit: this config relied on the old implicit default (debulk) — 2026-10-19

mesh: "../../resources/cube/cube_tet.msh"

simulation:
  dt: 0.005
  gravity: [0, -9.81, 0]
  num_iterations: 6
  stiffness: 0.4
  damping: 0.95
  substeps: 8

boundary:
  floor_y: 0.0
  fix_bottom: true
  fixed_ratio: 0.05

clusters:
  rings: 2

knife:
  radius: 0.025
  cutting_interval: 4
  alpha_min: 7.0
  aspiration_threshold: 0.45  # uniform mid value
  damage_growth_rate: 0.15

  per_edge_alpha: false
  damage_model: "sharpness"
  per_particle_tau: false     # uniform τ

self_collision:
  enabled: true
  radius: 0.012
  stiffness: 0.8

viewer:
  draw_surface: false
  draw_wireframe: true
  draw_points: true
