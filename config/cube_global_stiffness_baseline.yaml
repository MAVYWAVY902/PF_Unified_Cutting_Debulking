## Baseline: uniform global stiffness (midpoint of per-particle range 0.3/1.5 ≈ 0.85)
## Identical setup as cube_per_particle_stiffness.yaml but with per_particle_stiffness=false.
## Use this to compare cavity shape: heterogeneous vs uniform.

name: "Cube Global Stiffness (Uniform Baseline)"

mesh: "../../resources/cube/cube_tet.msh"

simulation:
  dt: 0.005
  gravity: [0, -9.81, 0]
  num_iterations: 6
  stiffness: 0.85
  damping: 0.95
  substeps: 8

boundary:
  floor_y: 0.0
  fix_bottom: true
  fixed_ratio: 0.05

clusters:
  rings: 2

knife:
  radius: 0.025
  cutting_interval: 4
  alpha_min: 7.0
  aspiration_threshold: 0.45
  damage_growth_rate: 0.15

  per_edge_alpha: false
  damage_model: "sharpness"
  per_particle_tau: false
  per_particle_stiffness: false   # uniform — global stiffness from above

self_collision:
  enabled: true
  radius: 0.012
  stiffness: 0.8

viewer:
  draw_surface: false
  draw_wireframe: true
  draw_points: true
