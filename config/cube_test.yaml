## P(F) Shape Matching - Cube Test Configuration
## Matches parameters from cube32.msh direct run

name: "Cube Test"

## Dense cube (1m x 1m x 1m, ~31k vertices, 158k tets)
mesh: "../../resources/cube/cube_dense.msh"

simulation:
  dt: 0.005
  gravity: [0, -9.81, 0]
  num_iterations: 16    # 之前4，更多迭代 → 更stiff
  stiffness: 1.0        # 之前0.6，满stiffness
  damping: 0.95         # 0.98 → 0.88 → 0.95（中间值）
  substeps: 8           # 之前4，更细时间步 → 更稳定

boundary:
  floor_y: 0.0
  fix_bottom: true
  fixed_ratio: 0.10

clusters:
  rings: 2

knife:
  radius: 0.1
  cutting_interval: 1   # update damage every physics step (was 50 — caused knife tunneling)
  alpha_min: 3.0        # softer P(F) sigmoid (was 10 — saturated damage on any contact)
  aspiration_threshold: 0.3

self_collision:
  enabled: true
  radius: 0.012
  stiffness: 0.8

viewer:
  draw_surface: true
  draw_wireframe: false
  draw_points: false
