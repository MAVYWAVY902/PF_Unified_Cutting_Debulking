## P(F) Shape Matching - Cube Test Configuration
## Matches parameters from cube32.msh direct run

name: "Cube Test"

## Use xpbd-tissue-sim's cube32 mesh (1m x 1m x 1m, ~21k vertices)
mesh: "/home/yunxin/xpbd-tissue-sim/resource/cube/cube32.msh"

simulation:
  dt: 0.005
  gravity: [0, -9.81, 0]
  num_iterations: 8
  stiffness: 0.85
  damping: 0.98
  substeps: 4

boundary:
  floor_y: 0.0
  fix_bottom: true
  fixed_ratio: 0.10

clusters:
  rings: 2

knife:
  radius: 0.1
  cutting_interval: 50
  alpha_min: 10.0
  aspiration_threshold: 0.3

self_collision:
  enabled: true
  radius: 0.012
  stiffness: 0.8

viewer:
  draw_surface: true
  draw_wireframe: false
  draw_points: false
