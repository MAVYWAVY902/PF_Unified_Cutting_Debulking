## Interactive test (2026-10-21, branch real_xpbd): itest_cube_scalpel_round_xpbd.yaml with SMALL STEPS (Macklin et al. 2019,
##   "Small Steps in Physics Simulation"): 64 substeps x 1 iteration per frame instead of 4 x 16 (same
##   number of solver iterations per frame, same 20 ms of sim time per frame). The leftover error of an
##   unconverged solve scales with dt^2, so many small substeps get much closer to the converged result
##   (static cube sag, XPBD 2e4: 2.04 mm vs 4.51 mm at 4 x 16; converged 1.83 mm). GPU cost +~18%.
##   Per-substep quantities are converted to keep the same per-second rates as the 4 x 16 config:
##     damping 0.95 per 5 ms        -> damping_rate 10.259 /s
##     damage_growth_rate 0.1/5 ms  -> 0.00625 per 0.3125 ms substep
##     proxy: particle radius/5 ms  -> tool_proxy_speed 0.887 m/s (sim time)
##   Run from cpp_sim/build:  ./pf_sim_gpu_viewer ../../config/itest_cube_scalpel_round_xpbd_ss64.yaml
## Interactive test (2026-10-21, branch real_xpbd): the round-back scalpel config with XPBD tissue elasticity.
##   Only difference from itest_cube_scalpel_round.yaml: simulation.solver xpbd + xpbd_stiffness.
##   At 16 iterations XPBD is far from converged (static test: converged sag needs ~128 iterations at
##   dt 5 ms), so it should feel close to PBD here — slightly softer (gravity sag ~4.3 vs ~3.4 mm).
##   Run from cpp_sim/build:  ./pf_sim_gpu_viewer ../../config/itest_cube_scalpel_round_xpbd.yaml
## Interactive test (2026-10-21): the split config with a ROUND-BACK scalpel (resources/tools/scalpel_round.obj,
##   tools/generate_scalpel_round_obj.py): same size and cutting-edge wedge, but the flat 9.6 mm spine (x12)
##   is a circular arc tangent to both faces (radius 4.4 mm at x12). Tissue resting on the back slides off
##   to its own side when the blade is pulled out, instead of being lifted (strands / stuck knife).
##   Run from cpp_sim/build:  ./pf_sim_gpu_viewer ../../config/itest_cube_scalpel_round.yaml
## Interactive test (2026-10-20): cube + scalpel (x12), cut only — the fixes config plus:
##   knife.straddle_fracture: false  R3 off: 95% of its breaks were triggered by deformation alone (the
##                                edge's ball shrank inside the blade outline, nothing passed through it);
##                                cutting is decided only by the blade edge passing between particles
##   render.split_tets: true      a cut tet is drawn as one piece per side (ending at the cut) instead of
##                                being hidden: no missing layer along the cut, no "floating" fragments
## Also on: cut_curve leading, contact_iterate, contact_ccd, tool_proxy (see itest_cube_scalpel_fixes.yaml).
## Known: the blunt spine / blade ends (thinner than the particle spacing) can slide between particles
##   without pushing them (the blade passes through the tissue there, no cut); not fixed yet.
## Known (model behaviour, accepted): pushing the blade sideways can break about one layer at the
##   bottom of the cut, where the tissue rests at the edge height and the edge sweeps past it.
## Run from cpp_sim/build:  ./pf_sim_gpu_viewer ../../config/itest_cube_scalpel_split.yaml
## See config/ITEST_README.md for keys and what to look for.

## P(F) Shape Matching - Cube Test Configuration
## Matches parameters from cube32.msh direct run

name: "Interactive: cube + scalpel (x12), cut only, fixes A(leading)+F1+B(proxy)+CCD"
debulking: false   # cut only: edges break, nothing is aspirated

## Dense cube (1m x 1m x 1m, ~31k vertices, 158k tets)
mesh: "../../resources/cube/cube_tet.msh"

simulation:
  dt: 0.0003125         # 20 ms per frame / 64 substeps
  gravity: [0, -9.81, 0]
  num_iterations: 1     # small steps: one iteration per substep
  stiffness: 1.0        # unused by xpbd
  solver: xpbd          # XPBD shape matching (compliance; dt- and iteration-independent once converged)
  xpbd_stiffness: 2.0e4 # k/m per particle-goal link, 1/s^2
  damping_rate: 10.259  # per second (= 0.95 per 5 ms substep)
  substeps: 64
  tool_proxy: true
  tool_proxy_speed: 0.887  # m/s sim time (= particle radius 4.437 mm per 5 ms)

boundary:
  floor_y: 0.0
  fix_bottom: true
  fixed_ratio: 0.10

clusters:
  rings: 2
  local_split: true           # R1: clusters split by their own intact edges

knife:
  radius: 0.04                 # sphere fallback only
  tool_mesh: "../../resources/tools/scalpel_round.obj"
  tool_scale: 12.0             # 144 x 60 x 9.6 mm blade, cutting edge along x at the bottom
  cutting_interval: 1          # damage every substep (mouse motion can be fast)
  alpha_min: 7.0
  aspiration_threshold: 0.7
  tool_sdf_resolution: 64
  sdf_normal: trilinear        # required by straddle_fracture
  cut_features: auto           # sharp edges / points from the tool mesh (wedge or cone angle < 30 deg)
  straddle_fracture: false     # R3 off (see header)
  cut_curve: leading           # edge cuts only when it passes between the particles AND leads
  contact_iterate: true        # F1: project until out of the tool
  contact_ccd: true            # CCD tool contact: a particle whose path crosses the tool (exact
                               # triangles) is put back on the face it came from
  damage_growth_rate: 0.00625  # = 0.1 per 5 ms (same rate per second)

self_collision:
  enabled: true
  radius: 0.0045       # 2026-09-19: kernel 判定距离 = 2×radius = 9mm ≈ 粒子间距 8.9mm (原 0.012 → 24mm, 2.7× 间距, 刀压时粒子被弹飞)
  stiffness: 0.8

## 地板 Coulomb 摩擦 (2026-09-19, 对齐 cardinalsim tumor_debulk.yaml)
## 没有 mesh，只用来覆盖 collision_kernel 的地板 μ_s/μ_k (默认 0.5/0.3)。
## 该模型的"法向力"= 每 substep 穿透深度 (~0.1mm)，μ 必须大才能锁住落地碎片。
rigid_object:
  friction_s: 2.0
  friction_k: 1.5

viewer:
  draw_surface: true
  draw_wireframe: false
  draw_points: false

render:
  split_tets: true             # a cut tet is drawn as one piece per side
