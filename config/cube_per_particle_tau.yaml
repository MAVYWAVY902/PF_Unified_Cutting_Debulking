## Per-particle τ (aspiration threshold = toughness) gradient experiment
## LEFT: low τ = fragile tissue (easy to cut)
## RIGHT: high τ = tough tissue (resists cutting)
## This is the CORRECT toughness modeling — τ directly controls yield threshold

name: "Cube Per-Particle τ (Toughness Gradient)"
debulking: true   # explicit: this config relied on the old implicit default (debulk) — 2026-10-19

mesh: "../../resources/cube/cube_tet.msh"

simulation:
  dt: 0.005
  gravity: [0, -9.81, 0]
  num_iterations: 6
  stiffness: 0.4
  damping: 0.95
  substeps: 8

boundary:
  floor_y: 0.0
  fix_bottom: true
  fixed_ratio: 0.05

clusters:
  rings: 2

knife:
  radius: 0.025
  cutting_interval: 4
  alpha_min: 7.0              # uniform sigmoid sharpness (no per-edge α here)
  aspiration_threshold: 0.3   # legacy default (only used if per_particle_tau=false)
  damage_growth_rate: 0.15

  per_edge_alpha: false       # NOT using per-edge α this time
  damage_model: "sharpness"   # back to default sharpness model

  # === Per-particle τ — toughness gradient ===
  per_particle_tau: true
  tau_low: 0.1                # LEFT: very fragile, removes at damage>0.1
  tau_high: 0.8               # RIGHT: very tough, removes only at damage>0.8
  tau_gradient_axis: "x"

self_collision:
  enabled: true
  radius: 0.012
  stiffness: 0.8

viewer:
  draw_surface: false
  draw_wireframe: true
  draw_points: true
