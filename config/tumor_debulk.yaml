## P(F) Shape Matching - Tumor Debulking Configuration

name: "Tumor Debulking"
debulking: true   # explicit: this config relied on the old implicit default (debulk) — 2026-10-19

## Mesh
mesh: "../../resources/tumor/tumor_uniform.msh"  # 10911 verts, 52735 tets; ~22 fps on RTX 2070
# mesh: "../../resources/tumor/tumor_7800_dense.msh"  # ~27k verts; 2-3× slower, 内部仍非 uniform (同 pipeline 只加密表面)
# mesh: "../../resources/tumor/tumor_uniform.msh"     # 由 tools/remesh_tumor_uniform.py 生成的真正 uniform 版本

## Simulation parameters
simulation:
  dt: 0.002             # 手工指定 (auto 在此 mesh 上算出 0.0005 太小)。0.002 在 PBD + damping=0.95
                        # 下的终端速度 ≈ 0.37 m/s → 每步位移 ~0.74mm (1.1× avg_spacing)，稳定边界
  gravity: [0, -9.81, 0]
  num_iterations: 15    # 从 40 降 (此 mesh cluster_membership=60，atomicAdd 竞争严重；
                        # stiffness=1.0 下 15 iter 足够收敛，substeps=8 额外提供 8×15=120 次机会)
  stiffness: 1.0        # shape matching stiffness [0, 1]
  damping: 0.95         # 0.98 → 0.88（减震荡）→ 0.95（中间值：保留碎片自由下落动能，接触振荡仍收敛）
  substeps: 8           # 手工指定 (auto 算出 ~40 过多)。8 × dt(0.002) = 0.016s sim/frame
                        # 在 ~25 fps 渲染下 ≈ 40% 实时速度，流畅可交互

## Boundary conditions
boundary:
  floor_y: 0.0
  fix_bottom: true       # attach bottom to ground
  fixed_ratio: 0.10      # fix bottom 10% of mesh height

## Cluster building
clusters:
  rings: 2              # BFS ring expansion for cluster building

## Knife / CUSA tool
knife:
  radius: 0.002         # 2mm tool tip (was auto ~5.2mm)
  cutting_interval: 1   # update damage every N physics steps (was 50 — caused knife to tunnel through tissue at normal drag speeds)
  alpha_min: 3.0        # P(F) sigmoid steepness (was 10 — too steep, damage saturated to 1 on any contact)
  aspiration_threshold: 0.3  # remove particles with damage > this

## Self-collision
self_collision:
  enabled: true
  radius: 0.000296      # 0.55 × avg_spacing (avg_spacing=0.646mm on tumor_7800.msh).
                        # 原 auto=0.45× 太小 (collision_dist=0.58mm < avg_spacing 0.65mm)，
                        # 碎片在 0.6-1.5mm 之间不触发排斥 → "嵌入"主体。
                        # 0.55× 把 collision_dist 提到 0.71mm，保守改善低速擦入穿透。
                        # 如需更强（tumor 不膨胀前提下），阶梯：0.000420 (0.65×) / 0.000453 (0.70×)
  stiffness: 0.8

## Rigid object (temporal bone)
rigid_object:
  mesh: "../../resources/tbone/tbone_MOD4.obj"
  collision_thickness: auto   # auto = 0.8x avg_spacing
  friction_s: 0.5             # static friction coefficient
  friction_k: 0.3             # kinetic friction coefficient

## Viewer
viewer:
  draw_surface: true
  draw_wireframe: false
  draw_points: false   # 关闭粒子点 — debulk时只看mesh更直观
