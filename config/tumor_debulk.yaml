## P(F) Shape Matching - Tumor Debulking Configuration

name: "Tumor Debulking"

## Mesh
mesh: "../../resources/tumor/tumor_7800.msh"  # relative to build dir

## Simulation parameters
simulation:
  dt: auto              # "auto" = scale by mesh height, or float (e.g. 0.001)
  gravity: [0, -9.81, 0]
  num_iterations: auto  # "auto" = scale by cluster overlap, or int (e.g. 16)
  stiffness: 1.0        # shape matching stiffness [0, 1]
  damping: 0.98         # velocity damping per step
  substeps: auto        # "auto" = compute from dt, or int (e.g. 20)

## Boundary conditions
boundary:
  floor_y: 0.0
  fix_bottom: true       # attach bottom to ground
  fixed_ratio: 0.10      # fix bottom 10% of mesh height

## Cluster building
clusters:
  rings: 2              # BFS ring expansion for cluster building

## Knife / CUSA tool
knife:
  radius: 0.002         # 2mm tool tip (was auto ~5.2mm)
  cutting_interval: 50  # update damage every N steps
  alpha_min: 10.0       # P(F) sigmoid steepness
  aspiration_threshold: 0.3  # remove particles with damage > this

## Self-collision
self_collision:
  enabled: true
  radius: auto          # "auto" = 0.45x avg_spacing, or float
  stiffness: 0.8

## Rigid object (temporal bone)
rigid_object:
  mesh: "../../resources/tbone/tbone_MOD4.obj"
  collision_thickness: auto   # auto = 0.8x avg_spacing
  friction_s: 0.5             # static friction coefficient
  friction_k: 0.3             # kinetic friction coefficient

## Viewer
viewer:
  draw_surface: true
  draw_wireframe: false
  draw_points: false   # 关闭粒子点 — debulk时只看mesh更直观
