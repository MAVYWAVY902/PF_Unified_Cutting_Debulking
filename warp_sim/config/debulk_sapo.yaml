## P(F) Debulking - SAPO Training Configuration

name: "Debulk SAPO"

# Environment
mesh: "resources/cube/cube_dense.msh"
settle_steps: 200
horizon_len: 32
sim_substeps: 4
action_scale: 0.005
knife_start: [0.5, 0.5, 0.5]   # inside mesh center (mesh settles ~0.48 centroid)
knife_radius: 0.15              # match diagnostic test — large enough to affect edges

# Physics
dt: 0.005
num_iterations: 4
stiffness: 0.6
damping: 0.98
cutting_interval: 1    # every substep for dense gradient signal

# Reward
lambda_nerve: 5.0
mu_action: 0.01
bonus: 10.0
volume_target: 50.0

# Nerve mask (spatial heuristic)
nerve:
  type: "y_band"
  y_min: 0.0
  y_max: null     # null = auto (bottom 25% of mesh height)

# SAPO Training
training:
  num_epochs: 1000
  actor_lr: 0.002
  critic_lr: 0.0005
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 0.5
  hidden_dim: 256
  actor_beta1: 0.7
  critic_iterations: 16
  no_target_critic: true
  init_alpha: 1.0
  target_entropy: -1.5
  log_interval: 10
  save_interval: 100
