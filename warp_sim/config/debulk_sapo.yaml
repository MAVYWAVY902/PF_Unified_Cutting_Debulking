## P(F) Debulking - SAPO Training (monolithic tape, short horizon)

name: "Debulk SAPO v3"

# Environment
mesh: "resources/cube/cube_dense.msh"
settle_steps: 200
horizon_len: 8              # start short, increase if gradients stable
sim_substeps: 2
action_scale: 0.005
knife_start: [0.5, 0.5, 0.5]
knife_radius: 0.15

# Physics
dt: 0.005
num_iterations: 4       # full physics for forward sim (gradient bypasses SVD via collision re-apply)
stiffness: 0.6
damping: 0.98
cutting_interval: 1

# Reward
lambda_nerve: 2.0

# Nerve mask
nerve:
  type: "y_band"
  y_min: 0.0
  y_max: null

# SAPO Training
training:
  num_epochs: 500
  actor_lr: 0.002
  critic_lr: 0.0005
  gamma: 0.99
  lam: 0.95
  max_grad_norm: 0.5
  hidden_dim: 256
  actor_beta1: 0.7
  critic_iterations: 16
  init_alpha: 1.0
  target_entropy: -1.5
  target_critic_tau: 0.005
  sim_grad_clip: 10.0       # clip sim gradient NORM (not values)
  log_interval: 10
  save_interval: 100
