## P(F) Capsule Task — Arm A (L1 baseline, no gradient)
## M3.5 ablation: PPO with plain obs (1516D), baseline for comparing against Arm X/Y/C.

name: "Debulk Capsule Arm A (L1)"

# Task selector (M3.1 added dispatch)
task_type: "capsule_only"    # IMPORTANT: switches to 4-term capsule reward in env

# Obs mode for ablation (M3.4 will implement dispatch)
obs_mode: "baseline"         # no extra dims (stays 1516D)

# Environment — TORUS TASK (switched from cuboid 2026-04-23)
# Rationale: cuboid interior is so dense that any motion debulks particles,
# so intracapsular-carving vs random-wandering are indistinguishable. Torus
# forces centerline-following — deviation hits capsule.
mesh: "resources/torus/torus.msh"
settle_steps: 200
sim_substeps: 2
action_scale: 0.003
knife_start: [1.0, 0.5, 0.25]       # Z-up (2026-04-24): just outside torus ring at +X equator; vertical Z=0.25 = ring mid-height
knife_radius: 0.05
# Episode raised 256 → 1024: one full ring sweep needs 2π·R/action_scale_max ≈ 423 steps.
# 1024 allows ~2.4 sweeps for policy to learn spiral/wobble coverage.
episode_length: 1024
debulk_threshold: 0.5
workspace_margin: -0.02

# Potential-based reward shaping (Ng 1999). Φ(s) = pbrs_alpha · interior_done_frac(s).
# Adds r' = r + pbrs_gamma·Φ(s') − Φ(s) each step. Policy-invariant per Ng's theorem,
# so Arm A/X/Y/C comparison stays valid. Provides dense progress signal bridging the
# gap to the sparse completion_bonus at 90% coverage.
pbrs_alpha: 50.0
pbrs_gamma: 0.995

# Physics
dt: 0.005
num_iterations: 6              # 2026-04-25: 4 → 6
stiffness: 0.85                # 2026-04-25: 0.6 → 0.85 on Z-up geometry
damping: 0.98
floor_friction: 0.95           # 2026-04-25: tangent slip damping [0..1]; 0=frictionless, 1=fully sticky
cutting_interval: 1

# Capsule-task reward params (M3.3)
capsule_budget: 0.05                    # 5% capsule breach = entry allowance
lambda_capsule: 30.0                    # asymmetric penalty weight
completion_interior_frac: 0.90          # NTR threshold: >90% interior debulked
catastrophic_breach_multiplier: 3.0     # terminate if breach > 3×budget = 15%
catastrophic_penalty: 100.0             # terminal -reward
step_penalty: 0.1                       # idle penalty (reused from legacy)
completion_bonus: 50.0                  # terminal bonus (reused from legacy)

# Legacy reward params — unused in capsule_only mode, left here as no-ops for env init
lambda_nerve: 10.0
waste_penalty_weight: 0.5
guidance_weight: 5.0
guidance_std: 0.15
surface_bonus: 2.0
interior_penalty: 5.0
surface_low: 0.1
surface_high: 0.9

# Nerve mask (not used — task_type=capsule_only skips this)
nerve:
  type: "y_band"
  y_min: 0.0
  y_max: null

# PPO training (same fixes as current debulk_ppo.yaml: n_epochs=4, target_kl=0.02, VecNormalize)
training:
  # total_timesteps unchanged; with episode_length=1024, this is ~488 episodes
  # (vs 1953 @ ep=256). Each episode now informative enough to compensate.
  total_timesteps: 500000
  learning_rate: 0.0003
  # n_steps bumped 512 → 2048 so rollout buffer spans 2 full episodes.
  n_steps: 2048
  batch_size: 128
  n_epochs: 4
  # γ, λ raised for long-horizon task (effective horizon 1/(1-γλ) ≈ 200 → 667).
  # One ring sweep = ~423 steps; old 200 was structurally under-horizon.
  gamma: 0.995
  gae_lambda: 0.97
  clip_range: 0.2
  ent_coef: 0.01
  vf_coef: 0.5
  max_grad_norm: 0.5
  target_kl: 0.02
  net_arch: [256, 256]
  save_freq: 50000
  use_vecnormalize: true
  norm_obs: true
  norm_reward: true
  clip_obs: 10.0
  clip_reward: 10.0
